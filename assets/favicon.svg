<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#090d16" />
  <rect x="4" y="4" width="56" height="56" rx="14" fill="none" stroke="url(#grad)" stroke-width="2" opacity="0.6" />
  
  <!-- Glowing 3D Microchip Core -->
  <g transform="translate(16, 16)" filter="url(#glow)">
    <rect x="6" y="6" width="20" height="20" rx="5" fill="url(#grad)" />
    <circle cx="16" cy="16" r="4" fill="#ffffff" />
    
    <!-- Chip Pins -->
    <line x1="16" y1="0" x2="16" y2="6" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" />
    <line x1="16" y1="26" x2="16" y2="32" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" />
    <line x1="0" y1="16" x2="6" y2="16" stroke="#6366f1" stroke-width="2" stroke-linecap="round" />
    <line x1="26" y1="16" x2="32" y2="16" stroke="#6366f1" stroke-width="2" stroke-linecap="round" />
    
    <line x1="10" y1="0" x2="10" y2="6" stroke="#06b6d4" stroke-width="1.5" />
    <line x1="22" y1="0" x2="22" y2="6" stroke="#06b6d4" stroke-width="1.5" />
    <line x1="10" y1="26" x2="10" y2="32" stroke="#06b6d4" stroke-width="1.5" />
    <line x1="22" y1="26" x2="22" y2="32" stroke="#06b6d4" stroke-width="1.5" />
  </g>
</svg>

